[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "release-check"
version = "0.2.0"
description = "A conservative, local release-readiness audit and clean-export CLI"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
authors = [{name = "TayHCode"}]

[project.scripts]
release-check = "release_check:main"

[tool.setuptools]
py-modules = ["release_check"]
